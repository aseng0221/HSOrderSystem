buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        mavenCentral()
        google()
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

subprojects { project ->
    configurations.all {
        resolutionStrategy {
            force 'androidx.compose.material:material:1.7.5'
            force 'androidx.compose.material:material-android:1.7.5'
            force 'androidx.compose.animation:animation:1.7.5'
            force 'androidx.compose.animation:animation-android:1.7.5'
            force 'androidx.compose.foundation:foundation:1.7.5'
            force 'androidx.compose.foundation:foundation-android:1.7.5'
            force 'androidx.compose.ui:ui:1.7.5'
            force 'androidx.compose.ui:ui-android:1.7.5'
            force 'androidx.compose.ui:ui-text:1.7.5'
            force 'androidx.compose.ui:ui-text-android:1.7.5'
            force 'androidx.compose.ui:ui-graphics:1.7.5'
            force 'androidx.compose.ui:ui-graphics-android:1.7.5'
            force 'androidx.compose.ui:ui-viewbinding:1.7.5'
            force 'androidx.compose.runtime:runtime:1.7.5'
            force 'androidx.compose.runtime:runtime-android:1.7.5'
            force 'androidx.compose.runtime:runtime-saveable:1.7.5'
            force 'androidx.compose.runtime:runtime-saveable-android:1.7.5'
            force 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
            force 'androidx.lifecycle:lifecycle-viewmodel-compose-android:2.8.7'
            force 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
            force 'androidx.lifecycle:lifecycle-runtime-compose-android:2.8.7'
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.21'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.21'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.21'
            force 'org.jetbrains.kotlin:kotlin-reflect:1.8.21'
        }
    }

    def setCompilerVersion = {
        if (project.hasProperty('android') && project.android.hasProperty('composeOptions')) {
            project.android.composeOptions.kotlinCompilerExtensionVersion = "1.4.7"
        }
    }

    if (project.state.executed) {
        setCompilerVersion()
    } else {
        project.afterEvaluate {
            setCompilerVersion()
        }
    }
}
